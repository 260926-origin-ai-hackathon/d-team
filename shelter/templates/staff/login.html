{% extends "staff/_base.html" %}
{% block title %}ログイン{% endblock %}
{% block body %}
<div class="card" style="max-width:420px;margin:48px auto">
  <h1>運営者ログイン</h1>
  <p class="muted">{{ profile.name }}</p>
  {% if error %}<div class="banner warn">{{ error }}</div>{% endif %}
  <form method="post" action="/staff/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="pin">PIN</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" autofocus style="width:100%;font-size:1.4rem">
    <p><button style="width:100%">ログイン</button></p>
  </form>
</div>
{% endblock %}
